<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Se busca: R.E.P.O</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper-light: #f1e2b8;
    --paper-dark: #d8c08c;
    --ink: #3b2a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1611;
    font-family: 'Special Elite', monospace;
    padding: 2rem 1rem;
  }
  .poster {
    width: 100%;
    max-width: 480px;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.05), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.08), transparent 45%),
      var(--paper-light);
    border: 10px solid var(--ink);
    outline: 2px solid var(--paper-dark);
    outline-offset: -18px;
    padding: 2rem 1.5rem 1.75rem;
    text-align: center;
    color: var(--ink);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    position: relative;
  }
  .se-busca {
    font-family: 'Rye', serif;
    font-size: 2.6rem;
    letter-spacing: 4px;
    margin: 0 0 0.5rem;
    line-height: 1;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }
  .subtitulo {
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 1.25rem;
    opacity: 0.75;
  }
  .marco-imagen {
    width: 260px;
    height: 260px;
    margin: 0 auto 1.25rem;
    border: 4px solid var(--ink);
    background: rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .marco-imagen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .nombre {
    font-family: 'Rye', serif;
    font-size: 2.4rem;
    letter-spacing: 3px;
    margin: 0.5rem 0 0.75rem;
    line-height: 1.05;
  }
  .linea {
    width: 60%;
    height: 2px;
    background: var(--ink);
    opacity: 0.4;
    margin: 0.75rem auto;
  }
  .visto {
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0.5rem 0 0;
  }
  .visto strong {
    display: block;
    font-size: 1.15rem;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="poster">
    <h1 class="se-busca">SE BUSCA</h1>
    <p class="subtitulo">Vivo o muerto</p>

    <div class="marco-imagen">
      <img src="pollo.png" alt="Imagen de R.E.P.O">
    </div>

    <h2 class="nombre">R.E.P.O</h2>
    <div class="linea"></div>
    <p class="visto">
      <strong>Ha sido visto</strong>
      cerca del lobby
    </p>
  </div>

</body>
</html>
